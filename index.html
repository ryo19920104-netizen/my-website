<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pyxel Game</title>
  <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
</head>
<body>
  <script type="py">
import pyxel

class App:
    def __init__(self):
        pyxel.init(160, 120)
        self.x = 0
        pyxel.run(self.update, self.draw)

    def update(self):
        self.x = (self.x + 1) % pyxel.width

    def draw(self):
        pyxel.cls(0)
        pyxel.rect(self.x, 50, 10, 10, 9)
        pyxel.text(50, 100, "Hello Pyxel!", 7)

App()
  </script>
</body>
</html>
